<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Space — Paper Companion reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,400;0,600;0,700&family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  html { background: #C9E3ED; }
  body { margin: 0; display: flex; justify-content: center; padding: 24px 0; }

  /* --- header band: a cloud shelf the stories hang from --- */
  .sky-band { position: absolute; left: 0; top: 0; width: 390px; height: 128px; }
  .sky-band svg { display: block; width: 100%; height: 100%; }
  .ribbon-wrap { position: absolute; left: 16px; top: 34px; z-index: 3; }

  /* --- the hanging gallery --- */
  .gallery { position: absolute; left: 0; top: 92px; width: 390px; height: 420px; }
  .pin { position: absolute; top: 0; width: 2px; height: 62px; background: var(--story); opacity: .7; }
  .clip { position: absolute; top: 52px; z-index: 4; }

  .frame { position: absolute; transform-origin: 50% 0; }
  .frame .polaroid { width: 100%; }

  .f-left   { left: -30px;  top: 122px; width: 146px; }
  .f-right  { right: -30px; top: 92px;  width: 146px; }
  .f-centre { left: 100px;  top: 58px;  width: 190px; z-index: 3; }

  .photo-sq { aspect-ratio: 1 / 1.18; }

  .sparkle { position: absolute; stroke: var(--story); stroke-width: 3; stroke-linecap: round; fill: none; opacity: .8; }

  /* --- the story line --- */
  .story { position: absolute; left: var(--screen-x); top: 528px; width: 214px; }
  .story__title {
    font-family: var(--font-hand);
    font-size: var(--t-display);
    line-height: 1.12;
    color: var(--text-large);
    margin: 0;
  }
  .story__rule { width: 132px; height: 7px; border-radius: 4px; background: var(--butter); margin: 8px 0 0; }
  .story__date { margin: 10px 0 0; font-size: var(--t-label); font-weight: 600; color: var(--text); }

  /* --- the companion --- */
  .companion { position: absolute; right: 2px; bottom: 150px; width: 152px; z-index: 2; }
  .companion img { width: 100%; display: block; }
  .companion__shadow {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    width: 96px; height: 14px; border-radius: 50%;
    background: var(--butter); opacity: .45;
  }
  .lv {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: -6px; z-index: 3;
    display: flex; align-items: center; gap: 7px;
    height: 30px; padding: 0 13px;
    border-radius: var(--r-pill);
    background: var(--cream);
    box-shadow: var(--lift-1);
    font-size: var(--t-micro); font-weight: 700; letter-spacing: .04em; color: var(--ink);
  }
  .lv__track { display: block; width: 46px; height: 6px; border-radius: 3px; background: var(--mist); overflow: hidden; }
  .lv__fill  { display: block; width: 34%; height: 100%; border-radius: 3px; background: var(--butter); }

  .cta { position: absolute; left: var(--screen-x); bottom: 152px; }

  /* --- tab bar wave --- */
  .wave { position: absolute; left: 0; bottom: var(--tabbar-h); width: 390px; height: 30px; display: block; }
</style>
</head>
<body>

<div class="screen grain">

  <!-- cloud shelf -->
  <div class="sky-band" aria-hidden="true">
    <svg viewBox="0 0 390 128" preserveAspectRatio="none">
      <path d="M0 0 H390 V78 C362 78 356 104 328 104 C300 104 296 80 268 80
               C240 80 234 106 206 106 C178 106 172 82 144 82
               C116 82 110 108 82 108 C54 108 48 84 20 84 C12 84 6 86 0 90 Z"
            fill="var(--mist)"></path>
    </svg>
  </div>

  <div class="ribbon-wrap"><span class="ribbon">My stories</span></div>

  <!-- the hanging gallery -->
  <div class="gallery">
    <div class="pin" style="left: 128px;"></div>
    <div class="pin" style="left: 262px;"></div>

    <!-- left: an older story -->
    <div class="frame f-left is-sway" style="transform: rotate(-9deg); animation-delay: -1.2s;">
      <div class="polaroid polaroid--sm">
        <div class="polaroid__photo photo-sq" style="background: var(--mist);">
          <svg viewBox="0 0 100 118" style="position:absolute;inset:0;width:100%;height:100%;" aria-hidden="true">
            <circle cx="70" cy="30" r="15" fill="var(--butter)"></circle>
            <path d="M0 80 C22 62 44 70 62 80 C76 88 90 76 100 82 L100 118 L0 118 Z" fill="var(--sky)"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- right: another older story -->
    <div class="frame f-right is-sway" style="transform: rotate(8deg); animation-delay: -2.6s;">
      <div class="polaroid polaroid--sm">
        <div class="polaroid__photo photo-sq" style="background: var(--sky);">
          <svg viewBox="0 0 100 118" style="position:absolute;inset:0;width:100%;height:100%;" aria-hidden="true">
            <circle cx="30" cy="28" r="12" fill="var(--cream)"></circle>
            <path d="M0 84 C24 66 46 76 66 84 C80 90 92 80 100 85 L100 118 L0 118 Z" fill="var(--story)"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- centre: the blank one that starts a story -->
    <div class="frame f-centre is-sway">
      <div class="polaroid polaroid--focus">
        <span class="tape" style="left: 10px; top: 4px; transform: rotate(-8deg);"></span>
        <div class="polaroid__photo photo-sq gingham" style="display:flex; align-items:center; justify-content:center;">
          <svg class="sparkle" style="left: 26px; top: 54px; width: 22px; height: 22px;" viewBox="0 0 22 22" aria-hidden="true">
            <path d="M3 14 L8 8 M10 16 L14 10 M2 6 L5 3"></path>
          </svg>
          <button class="disc" aria-label="Start a new story">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14"></path><path d="M5 12h14"></path>
            </svg>
          </button>
          <svg class="sparkle" style="right: 22px; bottom: 46px; width: 24px; height: 24px;" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8 L9 3 M6 15 L12 9 M14 18 L18 14"></path>
          </svg>
        </div>
        <span class="polaroid__caption">Summer Afternoon</span>
      </div>
    </div>

    <!-- clips sit on top of the frames -->
    <svg class="clip" style="left: 108px;" width="42" height="46" viewBox="0 0 42 46" aria-hidden="true">
      <path d="M8 16 L21 3 L34 16" stroke="var(--story)" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <rect x="5" y="14" width="32" height="26" rx="5" fill="var(--story)"></rect>
      <rect x="11" y="20" width="20" height="4" rx="2" fill="var(--mist)"></rect>
    </svg>
    <svg class="clip" style="left: 242px;" width="42" height="46" viewBox="0 0 42 46" aria-hidden="true">
      <path d="M8 16 L21 3 L34 16" stroke="var(--story)" stroke-width="3" fill="none" stroke-linecap="round"></path>
      <rect x="5" y="14" width="32" height="26" rx="5" fill="var(--story)"></rect>
      <rect x="11" y="20" width="20" height="4" rx="2" fill="var(--mist)"></rect>
    </svg>
  </div>

  <!-- the story in the middle of the line -->
  <div class="story">
    <p class="story__title">A Day About<br>Courage</p>
    <div class="story__rule"></div>
    <p class="story__date">12 June 2024 · 12 stories kept</p>
  </div>

  <!-- the companion, perched at the end of the line -->
  <div class="companion">
    <div class="companion__shadow"></div>
    <img class="is-bob" src="../assets/ip-pom-scarf.png" alt="Your companion, a pomeranian in a red scarf">
    <span class="lv">Lv.1 <span class="lv__track"><span class="lv__fill"></span></span></span>
  </div>

  <button class="btn cta">
    Open the sandplay
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12h13"></path><path d="M12 5l7 7-7 7"></path>
    </svg>
  </button>

  <!-- tab bar -->
  <svg class="wave" viewBox="0 0 390 30" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 30 C46 30 46 6 92 6 C138 6 138 30 184 30 C230 30 230 6 276 6 C322 6 322 30 368 30 L390 30 Z" fill="var(--sky)"></path>
  </svg>
  <nav class="tabbar">
    <a class="tab tab--active" href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 11 L12 4 L20 11 V20 H4 Z"></path><path d="M9.5 15.5 a2.5 2.5 0 0 1 5 0 a2.5 2.5 0 0 1 -5 0"></path>
      </svg>
      Stories
    </a>
    <a class="tab" href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"></circle><path d="M15 9 L10.5 10.5 L9 15 L13.5 13.5 Z"></path>
      </svg>
      Discover
    </a>
    <a class="tab" href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8.5" r="3.8"></circle><path d="M5 20 a7 7 0 0 1 14 0"></path>
      </svg>
      Me
    </a>
  </nav>

</div>

</body>
</html>
